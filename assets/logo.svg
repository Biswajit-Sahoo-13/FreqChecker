<!--
  FreqChecker Logo — Horizontal lockup (dark)
  Original artwork — not copied from FxSound
  Use on #181818 / #0f0f0f dark backgrounds
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 48" width="420" height="48" role="img" aria-label="FreqChecker — Speaker Diagnostic Studio">
  <title>FreqChecker — Speaker Diagnostic Studio</title>
  <!-- Mark -->
  <g transform="translate(0 4)">
    <rect x="0.5" y="0.5" width="39" height="39" rx="9" fill="#0f0f0f" stroke="#2b2b2b" stroke-width="1"/>
    <rect x="6.7" y="7.5" width="10.2" height="18" rx="2.2" fill="none" stroke="#d51535" stroke-width="1.6"/>
    <circle cx="11.8" cy="16.5" r="5.2" fill="none" stroke="#3a3a3a" stroke-width="0.9"/>
    <circle cx="11.8" cy="16.5" r="2.6" fill="#d51535"/>
    <circle cx="11.8" cy="16.5" r="0.9" fill="#ffffff" opacity="0.95"/>
    <circle cx="9.7" cy="10.7" r="0.7" fill="#2b2b2b"/>
    <circle cx="13.9" cy="10.7" r="0.7" fill="#2b2b2b"/>
    <circle cx="9.7" cy="22.3" r="0.7" fill="#2b2b2b"/>
    <circle cx="13.9" cy="22.3" r="0.7" fill="#2b2b2b"/>
    <path d="M 18.3 12.7 A 7 7 0 0 1 18.3 20.3" fill="none" stroke="#b1b1b1" stroke-width="1.25" stroke-linecap="round"/>
    <path d="M 20.9 10.7 A 10 10 0 0 1 20.9 22.3" fill="none" stroke="#d51535" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 23.5 8.5 A 13.5 13.5 0 0 1 23.5 24.5" fill="none" stroke="#7f7f7f" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <g transform="translate(22 21)">
      <circle cx="0" cy="0" r="5.2" fill="#d51535" stroke="#0f0f0f" stroke-width="1.2"/>
      <path d="M -2.6 -0.1 L -0.7 1.8 L 2.8 -1.9" fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
    <text x="52" y="20" font-size="16.5" font-weight="800" letter-spacing="1.2" fill="#ffffff">FREQ<tspan fill="#d51535">CHECKER</tspan></text>
    <text x="52.5" y="34.5" font-size="8.2" font-weight="600" letter-spacing="0.9" fill="#7f7f7f">SPEAKER DIAGNOSTIC STUDIO</text>
  </g>
  <!-- Accent underline (subtle) -->
  <rect x="52" y="38.5" width="84" height="1.6" rx="0.8" fill="#d51535" opacity="0.9"/>
</svg>
